name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download & Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale.exe"
          Start-Process -FilePath ".\tailscale.exe" -ArgumentList "/S" -Wait

      - name: Enable RDP & Create User
        run: |
          net user runneradmin Admin@123456
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

      - name: Connect Tailscale
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --unattended --force-reauth

      - name: Keep Alive (6 Hours)
        run: |
          Write-Host "========================================="
          Write-Host "RDP IS READY! CHECK YOUR TAILSCALE APP FOR THE IP"
          Write-Host "Username: runneradmin"
          Write-Host "Password: Admin@123456"
          Write-Host "========================================="
          Start-Sleep -Seconds 21600
